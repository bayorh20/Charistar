<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Connection Lost - FoodMaxx</title>
    <style>
      :root {
        --font-primary: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-accent: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        
        --bg-app: #FDFDFD;
        --bg-card: #FFFFFF;
        --primary: #FF5B26;
        --primary-hover: #E04818;
        --primary-glow: rgba(255, 91, 38, 0.15);
        --text-main: #4D423E;
        --text-muted: #9A9189;
        --border-color: #EAEAEA;
        --shadow-lg: 0 12px 40px rgba(26, 21, 18, 0.06);
        --glass-bg: rgba(253, 253, 253, 0.85);
        --glass-border: rgba(255, 255, 255, 0.4);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-app: #0F0B09;
          --bg-card: #171210;
          --primary: #FF6D3B;
          --primary-hover: #FF8257;
          --primary-glow: rgba(255, 109, 59, 0.2);
          --text-main: #D5CFC7;
          --text-muted: #9D9187;
          --border-color: #2D231F;
          --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.4);
          --glass-bg: rgba(15, 11, 9, 0.85);
          --glass-border: rgba(255, 255, 255, 0.03);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-user-select: none;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body {
        font-family: var(--font-primary);
        background-color: var(--bg-app);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100vw;
        padding: 24px;
        overflow: hidden;
        position: relative;
      }

      /* Animated Ambient Mesh Blobs */
      .ambient-bg {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
      }

      .ambient-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.15;
        animation: floatBlob 12s infinite alternate ease-in-out;
      }

      .blob-1 {
        background: var(--primary);
        width: 250px;
        height: 250px;
        top: 15%;
        left: 10%;
        animation-delay: 0s;
      }

      .blob-2 {
        background: #8B5CF6;
        width: 300px;
        height: 300px;
        bottom: 15%;
        right: 10%;
        animation-delay: -4s;
      }

      .blob-3 {
        background: #FBBF24;
        width: 200px;
        height: 200px;
        top: 50%;
        left: 60%;
        animation-delay: -8s;
      }

      @keyframes floatBlob {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(30px, 40px) scale(1.1);
        }
      }

      .offline-container {
        position: relative;
        z-index: 10;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        padding: 40px 24px;
        border-radius: 28px;
        box-shadow: var(--shadow-lg);
        max-width: 400px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 20px;
        transform: translateY(0);
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slideUp {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
        background: var(--primary);
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px var(--primary-glow);
      }

      .brand-name {
        font-family: var(--font-accent);
        font-weight: 900;
        font-size: 1.25rem;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, var(--primary) 0%, #FF8A65 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .icon-wrapper {
        background: var(--primary-glow);
        color: var(--primary);
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 12px 0 4px 0;
        position: relative;
        animation: pulseIcon 2s infinite ease-in-out;
      }

      @keyframes pulseIcon {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 var(--primary-glow);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 0 10px rgba(255, 91, 38, 0);
        }
      }

      .status-badge {
        background: rgba(239, 68, 68, 0.1);
        color: #EF4444;
        font-size: 0.68rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 5px 12px;
        border-radius: 12px;
        border: 1px solid rgba(239, 68, 68, 0.15);
      }

      h1 {
        font-family: var(--font-accent);
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--text-main);
        letter-spacing: -0.3px;
        margin-top: 4px;
      }

      p {
        font-size: 0.86rem;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 8px;
      }

      .btn-primary {
        background: var(--primary);
        color: #FFFFFF;
        border: none;
        border-radius: 20px;
        padding: 12px 28px;
        font-size: 0.88rem;
        font-weight: 800;
        cursor: pointer;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 14px var(--primary-glow);
        transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 18px var(--primary-glow);
      }

      .btn-primary:active {
        transform: translateY(1px);
      }

      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #FFFFFF;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .btn-primary.loading .btn-text {
        display: none;
      }
      .btn-primary.loading .spinner {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <!-- Ambient Background Blobs -->
    <div class="ambient-bg">
      <div class="ambient-blob blob-1"></div>
      <div class="ambient-blob blob-2"></div>
      <div class="ambient-blob blob-3"></div>
    </div>

    <!-- Main Container -->
    <div class="offline-container">
      <div class="brand-header">
        <div class="brand-logo">
          <!-- FoodMaxx Styled Fork/Spoon Mini SVG -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <span class="brand-name">FoodMaxx</span>
      </div>

      <div class="icon-wrapper">
        <!-- Wi-Fi Off Icon SVG -->
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.5"></path>
          <path d="M5 12.5a10.94 10.94 0 0 1 5.83-2.84"></path>
          <path d="M12 18a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 8"></path>
          <path d="M1.42 8a15.91 15.91 0 0 1 4.7-2.88"></path>
        </svg>
      </div>

      <span class="status-badge">Offline Mode</span>

      <h1>Connection Lost</h1>
      <p>We're having trouble connecting to FoodMaxx. Please check your internet connection and try reloading the page.</p>

      <button id="retry-btn" class="btn-primary">
        <div class="spinner"></div>
        <span class="btn-text">Try Again</span>
      </button>
    </div>

    <script>
      document.getElementById('retry-btn').addEventListener('click', function() {
        var btn = this;
        btn.classList.add('loading');
        btn.disabled = true;
        
        // Short timeout to give visual feedback to the loading spinner
        setTimeout(function() {
          if (navigator.onLine) {
            window.location.reload();
          } else {
            // Keep loading for a moment then reset if still offline
            btn.classList.remove('loading');
            btn.disabled = false;
          }
        }, 800);
      });

      // Automatically reload when connection is restored
      window.addEventListener('online', function() {
        window.location.reload();
      });
    </script>
  </body>
</html>
