  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    // ── Service Worker Cache-Busting on Release ───────────────────────────
    // Increment this version whenever a critical update is deployed.
    // Forces the browser to unregister the old SW, clear caches, and reload.
    var APP_VERSION = 'v5.4.0';
    try {
      if (localStorage.getItem('fm_app_version') !== APP_VERSION) {
        localStorage.setItem('fm_app_version', APP_VERSION);
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            var promises = [];
            for (var i = 0; i < registrations.length; i++) {
              promises.push(registrations[i].unregister());
            }
            if (window.caches) {
              promises.push(
                caches.keys().then(function (names) {
                  return Promise.all(names.map(function (name) { return caches.delete(name); }));
                })
              );
            }
            Promise.all(promises).then(function () {
              console.log('[Cache] Stale PWA cache cleared for version: ' + APP_VERSION);
              window.location.reload();
            }).catch(function () {
              window.location.reload();
            });
          });
        }
      }
    } catch (err) {
      console.error('Cache bust failed:', err);
    }

    // Automatically detect chunk load / network errors and recover by clearing service worker cache
    window.addEventListener('error', function (e) {
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        var src = e.target.src || e.target.href;
        if (src && !src.startsWith(window.location.origin) && !src.startsWith('/')) {
          console.warn('Ignoring third-party/external resource load failure:', src);
          return;
        }

        console.warn('Resource load failed, checking network status...', src);

        // CRITICAL: If the user is offline, DO NOT unregister the service worker or flush caches.
        if (navigator.onLine === false) {
          console.warn('Resource fetch failed because user is offline. Retaining caches.');
          return;
        }

        // Check if we already reloaded recently to prevent infinite reload loops
        var urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('r') || window.location.hash.indexOf('r=1') !== -1) {
          console.error('Already attempted recovery reload. Aborting reload loop to prevent browser freeze.');
          return;
        }

        console.warn('Resource load failed while online. Flushing PWA cache to recover...');

        var performReload = function () {
          var separator = window.location.href.indexOf('?') !== -1 ? '&' : '?';
          window.location.href = window.location.href + separator + 'r=1';
        };

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            var promises = [];
            for (var i = 0; i < registrations.length; i++) {
              promises.push(registrations[i].unregister());
            }
            if (window.caches) {
              promises.push(
                caches.keys().then(function (names) {
                  return Promise.all(names.map(function (name) { return caches.delete(name); }));
                })
              );
            }
            Promise.all(promises).then(performReload).catch(performReload);
          }).catch(performReload);
        } else {
          performReload();
        }
      }
    }, true);
  </script>

</head>
