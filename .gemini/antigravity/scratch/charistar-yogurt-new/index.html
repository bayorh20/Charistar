<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fffdfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://api.dicebear.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://charistaryogurt.com.ng" crossorigin />
    <link rel="preconnect" href="https://js.paystack.co" crossorigin />
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <title>Charistar Yogurt</title>
  </head>
  <body>
    <div id="root">
      <!-- Premium CSS Inline Loader that loads instantly -->
      <style>
        .initial-loader-wrapper {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #050505;
          z-index: 9999;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .initial-loader-spinner {
          position: relative;
          width: 80px;
          height: 80px;
        }
        .initial-loader-ring {
          position: absolute;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          border: 3px solid rgba(163, 198, 68, 0.08);
          border-top-color: #A3C644;
          animation: initial-spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
          box-shadow: 0 0 15px rgba(163, 198, 68, 0.2);
        }
        .initial-loader-icon {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 28px;
          animation: initial-pulse 1.8s ease-in-out infinite;
        }
        .initial-loader-text {
          margin-top: 24px;
          font-size: 14px;
          font-weight: 700;
          color: #ffffff;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          opacity: 0.8;
          text-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
        }
        @keyframes initial-spin {
          to { transform: rotate(360deg); }
        }
        @keyframes initial-pulse {
          0%, 100% { transform: scale(1); opacity: 0.85; }
          50% { transform: scale(1.12); opacity: 1; }
        }
      </style>
      <div class="initial-loader-wrapper">
        <div class="initial-loader-spinner">
          <div class="initial-loader-ring"></div>
          <div class="initial-loader-icon">🫙</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
